<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1219">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>SUBTRACK — 구독 다이어트</title>
<style>
:root{
  --bg:#0f1219;
  --surface:#171c26;
  --surface2:#212836;
  --surface3:#2a3345;
  --text:#f3f6fc;
  --muted:#8e9bb0;
  --accent:#7c6cff;
  --accent-soft:rgba(124,108,255,.16);
  --green:#3dd598;
  --green-soft:rgba(61,213,152,.14);
  --orange:#ffb35c;
  --orange-soft:rgba(255,179,92,.14);
  --danger:#ff6b78;
  --danger-soft:rgba(255,107,120,.14);
  --radius:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",system-ui,sans-serif;
  letter-spacing:-.2px;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;transition:transform .12s ease,opacity .15s ease,background .15s ease}
button:active{transform:scale(.97)}

.app{
  max-width:520px;margin:auto;
  padding:calc(16px + env(safe-area-inset-top)) 18px calc(104px + env(safe-area-inset-bottom));
}

/* 헤더 */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.brand{font-size:11px;font-weight:800;letter-spacing:1.8px;color:var(--accent);text-transform:uppercase}
.top h1{font-size:24px;font-weight:800;margin:4px 0 0;letter-spacing:-.6px}
.top-actions{display:flex;gap:8px}
.iconbtn{
  width:40px;height:40px;border-radius:14px;background:var(--surface);
  display:grid;place-items:center;color:var(--muted);font-size:17px;
}
.iconbtn:active{background:var(--surface2);color:var(--text)}

.view{display:none;animation:fadeIn .2s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* 히어로 카드 */
.hero{
  background:linear-gradient(145deg,#252846 0%,#1a2033 100%);
  padding:24px 22px;border-radius:24px;
  box-shadow:0 12px 32px rgba(0,0,0,.28);
}
.hero.save{background:linear-gradient(145deg,#18362e 0%,#152429 100%)}
.hero small{color:rgba(255,255,255,.68);font-size:13px;font-weight:500}
.total{font-size:36px;font-weight:800;margin:8px 0 4px;letter-spacing:-1.2px}
.year{color:#a8b5ff;font-size:13px;font-weight:500}
.hero.save .year{color:#7ee8be}

/* 요약 2열 */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 22px}
.stat{background:var(--surface);border-radius:18px;padding:15px 16px}
.stat label{display:block;color:var(--muted);font-size:12px;font-weight:500}
.stat strong{display:block;font-size:20px;font-weight:800;margin-top:6px;letter-spacing:-.5px}

/* 섹션 헤더 */
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}
.sectionhead h2{font-size:16px;font-weight:700;margin:0;color:var(--text)}
.sectionhead small{color:var(--muted);font-size:12px}

/* 필터 칩 */
.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  background:var(--surface);color:var(--muted);
  border-radius:999px;padding:8px 14px;white-space:nowrap;font-size:13px;font-weight:600;
}
.chip.active{background:var(--accent);color:#fff}

/* 리스트 & 카드 */
.list{display:grid;gap:10px}
.item{
  display:flex;align-items:center;gap:13px;
  background:var(--surface);border-radius:18px;padding:14px;
  width:100%;text-align:left;
}
.item:active{background:var(--surface2)}
.logo{
  width:46px;height:46px;border-radius:15px;
  display:grid;place-items:center;font-weight:800;font-size:15px;flex-shrink:0;color:#fff;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.25);
}
.details{flex:1;min-width:0}
.details-top{display:flex;align-items:center;gap:6px}
.details b{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dday{
  font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;
  background:var(--surface2);color:var(--muted);flex-shrink:0;
}
.dday.soon{background:var(--orange-soft);color:var(--orange)}
.dday.today{background:var(--danger-soft);color:var(--danger)}
.details small{color:var(--muted);display:block;margin-top:4px;font-size:12px}

.price{text-align:right;font-weight:800;font-size:15px;white-space:nowrap}
.price small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:4px}

.badge{display:inline-block;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;margin-top:6px}
.g-good{background:var(--green-soft);color:var(--green)}
.g-ok{background:var(--accent-soft);color:#b2a8ff}
.g-meh{background:var(--orange-soft);color:var(--orange)}
.g-bad{background:var(--danger-soft);color:var(--danger)}
.g-none{background:var(--surface2);color:var(--muted)}

.empty,.card{
  background:var(--surface);border-radius:20px;padding:26px 20px;
  color:var(--muted);line-height:1.65;font-size:14px;text-align:center;
}
.card{text-align:left;color:var(--text)}
.card h3{margin:0 0 8px;font-size:17px;font-weight:700}
.card p{margin:6px 0;color:var(--muted);font-size:14px}
.card ul{margin:10px 0;padding-left:18px;color:var(--muted);font-size:13px}
.btn-primary{
  width:100%;background:var(--accent);color:#fff;
  padding:14px;border-radius:15px;font-weight:700;font-size:15px;margin-top:12px;
}

.note{color:#66738a;font-size:12px;text-align:center;margin-top:20px;line-height:1.6}
.note a{color:#8492aa;text-decoration:none}

/* 갈아타기 요소 */
.month{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border-radius:16px;padding:10px 14px;
}
.month.now{background:linear-gradient(90deg,rgba(124,108,255,.16),var(--surface))}
.month span{width:54px;color:var(--muted);font-size:13px;font-weight:600;flex-shrink:0}
.month.now span{color:#b5abff}
.month select{
  flex:1;background:var(--surface2);border:0;color:var(--text);
  border-radius:11px;padding:10px 12px;font-weight:600;outline:none;
}
.month b{font-size:13px;white-space:nowrap;min-width:68px;text-align:right}

.toggle{
  display:flex;align-items:center;gap:12px;
  background:var(--surface);border-radius:16px;padding:13px 15px;cursor:pointer;
}
.toggle input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.toggle div{flex:1}
.toggle small{color:var(--muted);font-size:12px}

.todo{background:var(--surface);border-radius:18px;padding:15px 16px;font-size:14px;line-height:1.8}
.todo .x{color:var(--danger)}
.todo .o{color:var(--green)}

/* 플로팅 추가 버튼 */
.fab{
  position:fixed;right:max(20px,calc(50% - 240px));
  bottom:calc(82px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:20px;
  background:var(--accent);color:#fff;font-size:28px;font-weight:400;
  display:grid;place-items:center;
  box-shadow:0 8px 24px rgba(124,108,255,.45);
  z-index:4;
}
.fab.hide{display:none}

/* 하단 탭 바 */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:5;
  background:rgba(15,18,25,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid rgba(255,255,255,.06);
  padding:8px 12px calc(10px + env(safe-area-inset-bottom));
}
.tabbar-inner{max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabbar button{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:6px 4px;border-radius:14px;color:var(--muted);font-size:11px;font-weight:600;
}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.active{color:var(--text)}
.tabbar button.active svg{stroke:var(--accent)}

/* 바텀시트 모달 */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.62);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:10;opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.overlay.show{opacity:1;pointer-events:auto}
.modal{
  background:var(--surface);width:100%;max-width:520px;max-height:88vh;overflow:auto;
  border-radius:26px 26px 0 0;
  padding:12px 20px calc(26px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .26s cubic-bezier(.22,1,.36,1);
}
.overlay.show .modal{transform:translateY(0)}
.handle{width:38px;height:4px;border-radius:99px;background:var(--surface3);margin:0 auto 16px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-head h2{margin:0;font-size:19px;font-weight:800}
.back-btn{color:var(--muted);font-size:14px;font-weight:600;padding:4px 8px}

/* 프리셋 검색 & 그리드 */
.search{
  width:100%;background:var(--surface2);border:0;border-radius:14px;
  padding:13px 15px;font-size:14px;outline:none;margin-bottom:14px;
}
.search::placeholder{color:var(--muted)}
.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.preset-btn{
  display:flex;align-items:center;gap:10px;
  background:var(--surface2);border-radius:15px;padding:11px 12px;text-align:left;
}
.preset-btn .mini-logo{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  font-weight:800;font-size:12px;color:#fff;flex-shrink:0;
}
.preset-btn span{font-size:13px;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preset-btn small{font-size:11px;color:var(--muted)}
.custom-btn{
  width:100%;background:var(--accent-soft);color:#b8aeff;
  border-radius:14px;padding:14px;font-weight:700;font-size:14px;margin-bottom:10px;
}

/* 폼 */
.form{display:grid;gap:14px}
.form label{font-size:12px;color:var(--muted);font-weight:600}
.form input,.form select{
  width:100%;margin-top:6px;background:var(--surface2);border:0;
  color:var(--text);border-radius:14px;padding:13px 14px;outline:none;font-size:15px;
}
.form input:focus,.form select:focus{box-shadow:0 0 0 2px var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.plan-chip{
  background:var(--surface2);color:var(--text);
  border-radius:11px;padding:7px 11px;font-size:12px;font-weight:600;
}
.plan-chip.active{background:var(--accent);color:#fff}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface2);padding:4px;border-radius:14px;margin-top:6px}
.seg button{padding:9px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.active{background:var(--surface3);color:#fff}

.save{width:100%;background:var(--accent);color:#fff;padding:15px;border-radius:15px;font-weight:700;font-size:15px}
.cancel{width:100%;background:var(--surface2);color:var(--muted);padding:13px;border-radius:15px;font-weight:600}
.del{width:100%;background:var(--danger-soft);color:var(--danger);padding:13px;border-radius:15px;font-weight:700}

.applist{display:grid;gap:8px;margin-bottom:14px}
.applist button{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--surface2);color:var(--text);border-radius:14px;padding:13px 15px;text-align:left;
}
.applist button.sel{background:var(--green-soft);color:var(--green)}
.applist small{color:var(--muted);white-space:nowrap}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div><div class="brand">SUBTRACK</div><h1 id="pageTitle">구독 다이어트</h1></div>
    <div class="top-actions">
      <button class="iconbtn" id="importBtn" title="백업 불러오기">⇧</button>
      <button class="iconbtn" id="exportBtn" title="데이터 백업">⇩</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </header>

  <!-- 구독 목록 -->
  <section class="view active" id="view-subs">
    <div class="hero">
      <small>월 구독 예상 금액</small>
      <div class="total" id="total">₩0</div>
      <div class="year" id="annual">연간 예상 ₩0</div>
    </div>
    <div class="stats">
      <div class="stat"><label>활성 구독</label><strong id="count">0개</strong></div>
      <div class="stat"><label>다음 결제</label><strong id="next">-</strong></div>
    </div>
    <div class="sectionhead"><h2>구독 목록</h2><small>눌러서 수정</small></div>
    <div class="chips" id="filters"></div>
    <div class="list" id="list"></div>
    <div class="note">데이터는 이 기기에만 안전하게 저장됩니다.<br><a href="./privacy.html">개인정보처리방침</a></div>
  </section>

  <!-- 가성비 점수 -->
  <section class="view" id="view-value"><div id="valueBody"></div></section>

  <!-- OTT 갈아타기 -->
  <section class="view" id="view-rotate"><div id="rotateBody"></div></section>
</main>

<!-- 플로팅 추가 버튼 -->
<button class="fab" id="fabAdd" aria-label="구독 추가">＋</button>

<!-- 하단 탭 바 -->
<nav class="tabbar" id="tabs">
  <div class="tabbar-inner">
    <button data-tab="subs" class="active">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg>
      <span>구독</span>
    </button>
    <button data-tab="value">
      <svg viewBox="0 0 24 24"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
      <span>가성비</span>
    </button>
    <button data-tab="rotate">
      <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
      <span>갈아타기</span>
    </button>
  </div>
</nav>

<!-- 구독 추가/수정 바텀시트 -->
<div class="overlay" id="subOverlay"><div class="modal">
  <div class="handle"></div>

  <!-- 1단계: 서비스 선택 -->
  <div id="stepPick">
    <div class="modal-head"><h2>어떤 구독을 추가할까요?</h2></div>
    <input class="search" id="presetSearch" placeholder="서비스 검색 (예: 넷플릭스, 밀리의 서재)">
    <div id="customWrap"></div>
    <div class="preset-grid" id="presetGrid"></div>
    <button class="cancel" type="button" data-close>닫기</button>
  </div>

  <!-- 2단계: 상세 입력 -->
  <div id="stepForm" hidden>
    <div class="modal-head">
      <h2 id="subTitle">구독 추가</h2>
      <button class="back-btn" type="button" id="backToPick">← 목록으로</button>
    </div>
    <form class="form" id="subForm">
      <label>서비스 이름<input id="name" required placeholder="예: 넷플릭스"></label>
      <div>
        <label>결제 주기</label>
        <div class="seg" id="cycleSeg">
          <button type="button" data-cycle="month" class="active">월간 결제</button>
          <button type="button" data-cycle="year">연간 결제</button>
        </div>
      </div>
      <div>
        <label id="amountLabel">월 결제 금액 (원)<input id="amount" type="number" min="1" inputmode="numeric" required placeholder="17000"></label>
        <div class="plan-chips" id="planChips"></div>
      </div>
      <div class="two">
        <label>카테고리<select id="category"></select></label>
        <label>결제일<select id="day"></select></label>
      </div>
      <button class="save">저장하기</button>
      <button class="del" type="button" id="deleteSub" hidden>이 구독 삭제</button>
      <button class="cancel" type="button" data-close>취소</button>
    </form>
  </div>
</div></div>

<!-- 앱 연결 바텀시트 -->
<div class="overlay" id="linkOverlay"><div class="modal">
  <div class="handle"></div>
  <div class="modal-head"><h2 id="linkTitle">앱 연결</h2></div>
  <p style="color:var(--muted);font-size:13px;margin:-6px 0 14px">최근 30일 동안 사용한 앱입니다. 이 구독과 연결할 앱을 골라 주세요.</p>
  <div class="applist" id="appList"></div>
  <button class="cancel" type="button" data-close>닫기</button>
</div></div>

<script>
/* ---------- 저장소 ---------- */
const KEY = 'subtrack-v1', PLAN_KEY = 'subtrack-plan-v1';
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch (e) { return d } };
let subs = load(KEY, []);
let plan = load(PLAN_KEY, { include: {}, months: {} });
subs.forEach(s => { if (!s.id) s.id = Math.random().toString(36).slice(2, 10) });
const persist = () => localStorage.setItem(KEY, JSON.stringify(subs));
const savePlan = () => localStorage.setItem(PLAN_KEY, JSON.stringify(plan));
persist();

/* ---------- 공통 ---------- */
const $ = s => document.querySelector(s);
const CATS = ['OTT', '영상', '음악', 'AI', '클라우드', '게임', '쇼핑', '생산성', '기타'];
const VIDEO_CATS = ['OTT', '영상'];
const COLORS = ['#7c6cff', '#e63b50', '#14a77c', '#2685df', '#e5a42d', '#ec6b36', '#aa62db', '#4c98c8'];
const fmt = n => '₩' + Math.round(Number(n || 0)).toLocaleString('ko-KR');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const monthlyPrice = s => s.cycle === 'year' ? Math.round(s.price / 12) : s.price;
const payDate = (y, m, day) => new Date(y, m, Math.min(day, new Date(y, m + 1, 0).getDate()));
const hm = min => min < 60 ? min + '분' : Math.floor(min / 60) + '시간' + (min % 60 ? ' ' + (min % 60) + '분' : '');
const isNative = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());

function daysUntil(day) {
  const t = new Date(), today = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  let d = payDate(t.getFullYear(), t.getMonth(), day);
  if (d < today) d = payDate(t.getFullYear(), t.getMonth() + 1, day);
  return { date: d, diff: Math.round((d - today) / 86400000) };
}

/* ---------- 주요 서비스 프리셋 (빠른 등록 + 앱 자동 연결 통합) ---------- */
const CATALOG = [
  { name: '넷플릭스', cat: 'OTT', color: '#e50914', pkg: 'com.netflix.mediaclient', re: /넷플릭스|netflix/i, plans: [['광고형', 5500], ['스탠다드', 13500], ['프리미엄', 17000]] },
  { name: '유튜브 프리미엄', cat: '영상', color: '#ff0033', pkg: 'com.google.android.youtube', re: /유튜브(?!\s*뮤직)|youtube(?!\s*music)/i, plans: [['개인', 14900], ['라이트', 8500]] },
  { name: '티빙', cat: 'OTT', color: '#ff153c', pkg: 'net.cj.cjhv.gs.tving', re: /티빙|tving/i, plans: [['광고형', 5500], ['베이직', 9500], ['스탠다드', 13500], ['프리미엄', 17000]] },

const colorOf = name => {
  const hit = CATALOG.find(p => p.re.test(name));
  if (hit) return hit.color;
  let h = 0; for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return COLORS[h % COLORS.length];
};

async function getUsagePlugin() {
  if (Usage || !isNative()) return Usage;

}

let filter = '전체';
function renderSubs() {
  const total = subs.reduce((a, s) => a + monthlyPrice(s), 0);
  $('#total').textContent = fmt(total);
  $('#annual').textContent = '연간 예상 ' + fmt(total * 12);
  $('#count').textContent = subs.length + '개';

  const upcoming = subs.map(s => daysUntil(s.day)).sort((a, b) => a.diff - b.diff)[0];
  $('#next').textContent = upcoming ? `${upcoming.date.getMonth() + 1}/${upcoming.date.getDate()} (${upcoming.diff === 0 ? '오늘' : 'D-' + upcoming.diff})` : '-';

  const f = $('#filters'); f.innerHTML = '';
  const usedCats = ['전체', ...CATS.filter(c => subs.some(s => s.cat === c))];
  if (!usedCats.includes(filter)) filter = '전체';
  usedCats.forEach(c => {
    const b = document.createElement('button'); b.className = 'chip' + (c === filter ? ' active' : ''); b.textContent = c;
    b.onclick = () => { filter = c; renderSubs() }; f.append(b);
  });

  const list = $('#list'); list.innerHTML = '';
  const items = subs.filter(s => filter === '전체' || s.cat === filter)
    .sort((a, b) => daysUntil(a.day).diff - daysUntil(b.day).diff);

  if (!items.length) {
    list.innerHTML = '<div class="empty">등록된 구독이 아직 없어요.<br>오른쪽 아래 <b>＋</b> 버튼으로 3초 만에 추가해 보세요.</div>';
    return;
  }

  items.forEach(s => {
    const { diff } = daysUntil(s.day);
    const dCls = diff === 0 ? 'today' : diff <= 3 ? 'soon' : '';
    const dText = diff === 0 ? '오늘 결제' : 'D-' + diff;
    const b = document.createElement('button'); b.className = 'item';
    b.innerHTML = `<div class="logo" style="background:${colorOf(s.name)}">${esc(s.name.slice(0, 2).toUpperCase())}</div>

    b.onclick = () => openSubForm(s.id);

  });

let usageApps = null, usageState = 'idle';

async function refreshUsage() {
  if (!isNative()) { usageState = 'web'; return }
  const U = await getUsagePlugin();
  if (!U) { usageState = 'error'; return }
  try {
    const { granted } = await U.checkPermission();
    if (!granted) { usageState = 'denied'; return }
    const r = await U.getUsage({ days: 30 });
    usageApps = r.apps || []; usageState = 'ok';
  } catch (e) { usageState = 'error' }
}

function linkedApp(s) {
  if (s.pkg === 'none') return null;
  const apps = usageApps || [];
  const byPkg = pkg => apps.find(a => a.pkg === pkg) || { pkg, label: null, minutes: 0 };
  if (s.pkg) return byPkg(s.pkg);
  const preset = CATALOG.find(p => p.pkg && p.re.test(s.name));
  if (preset) return byPkg(preset.pkg);
  const n = s.name.toLowerCase().replace(/\s/g, '');
  const hit = apps.find(a => { const l = (a.label || '').toLowerCase().replace(/\s/g, ''); return l.length > 1 && (l.includes(n) || n.includes(l)) });
  return hit || null;
}

function grade(s, app) {
  if (!app) return { cls: 'g-none', text: '앱 연결 필요', cph: null };
  if (!app.minutes) return { cls: 'g-bad', text: '30일간 안 씀 · 해지 추천', cph: Infinity };
  const cph = monthlyPrice(s) / (app.minutes / 60);
  if (cph < 1000) return { cls: 'g-good', text: '아주 잘 쓰는 중', cph };
  if (cph < 3000) return { cls: 'g-ok', text: '괜찮아요', cph };
  if (cph < 7000) return { cls: 'g-meh', text: '조금 아까워요', cph };
  return { cls: 'g-bad', text: '돈값 못 함 · 해지 고려', cph };
}

    return;
  }
  if (usageState === 'denied') {

      <p>앱별 사용 시간을 읽어 구독료를 시간당 금액으로 계산해 보여드려요.</p>
      <ul><li>사용 시간 정보는 <b>이 기기 안에서만</b> 계산됩니다.</li>
      <li>외부 서버로 전송되지 않습니다.</li>
      <li>목록에서 <b>SUBTRACK</b>을 찾아 접근 허용을 켜 주세요.</li></ul>
      <button class="btn-primary" id="grantBtn">사용 정보 접근 허용하러 가기</button></div>`;
    $('#grantBtn').onclick = async () => { const U = await getUsagePlugin(); U && U.openSettings() };
    return;
  }
  if (usageState === 'error') { body.innerHTML = '<div class="card"><h3>사용 시간을 불러오지 못했어요</h3><p>앱을 다시 실행해 주세요.</p></div>'; return }
  if (usageState !== 'ok') { body.innerHTML = '<div class="empty">사용 기록을 불러오는 중…</div>'; return }

  const rows = subs.map(s => { const app = linkedApp(s); return { s, app, g: grade(s, app) } })
    .sort((a, b) => (b.g.cph ?? -1) - (a.g.cph ?? -1));
  const waste = rows.filter(r => r.g.cls === 'g-bad').reduce((a, r) => a + monthlyPrice(r.s), 0);

      <div class="total">${fmt(waste)}<span style="font-size:15px;font-weight:600;opacity:.8"> /월</span></div>
      <div class="year">${waste ? '정리하면 1년에 ' + fmt(waste * 12) + ' 아낄 수 있어요' : '모든 구독을 알차게 쓰고 있어요'}</div></div>
    <div class="stats"><div class="stat"><label>분석된 구독</label><strong>${scored.length}/${subs.length}개</strong></div>

    <div class="sectionhead"><h2>구독별 시간당 금액</h2><small>눌러서 앱 변경</small></div><div class="list" id="valueList"></div>

    const right = g.cph === null ? '-' : g.cph === Infinity ? '0분' : fmt(g.cph);

    b.innerHTML = `<div class="logo" style="background:${colorOf(s.name)}">${esc(s.name.slice(0, 2).toUpperCase())}</div>

      <div class="price">${right}<small>${unit}</small></div>`;

function openLink(id) {
  const s = subs.find(x => x.id === id); if (!s) return;
  const current = linkedApp(s);
  $('#linkTitle').textContent = s.name + ' 앱 연결';
  const list = $('#appList'); list.innerHTML = '';
  const apps = [...(usageApps || [])].sort((a, b) => b.minutes - a.minutes);
  const pick = pkg => { s.pkg = pkg; persist(); hide('#linkOverlay'); renderValue() };
  const add = (label, sub, pkg, sel) => {
    const b = document.createElement('button'); if (sel) b.className = 'sel';
    b.innerHTML = `<span>${esc(label)}</span><small>${esc(sub)}</small>`; b.onclick = () => pick(pkg); list.append(b);
  };
  add('자동으로 찾기', '이름으로 연결', undefined, !s.pkg);
  add('연결 안 함', '점수에서 제외', 'none', s.pkg === 'none');
  apps.forEach(a => add(a.label || a.pkg, hm(a.minutes), a.pkg, current && current.pkg === a.pkg && !!s.pkg));
  show('#linkOverlay');
}

/* ---------- 갈아타기 탭 ---------- */
const monthKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
function renderRotate() {
  const body = $('#rotateBody');
  const vids = subs.filter(s => VIDEO_CATS.includes(s.cat));
  if (vids.length < 2) {
    body.innerHTML = `<div class="card"><h3>🔁 OTT 갈아타기 플래너</h3>
      <p>여러 OTT를 동시에 구독하지 말고, 한 달에 하나씩 돌려 쓰면 구독료를 크게 줄일 수 있어요.</p>
      <p>카테고리가 <b>OTT</b> 또는 <b>영상</b>인 구독을 2개 이상 등록하면 6개월 계획을 자동으로 짜 드립니다.</p></div>`;
    return;
  }
  vids.forEach(s => { if (!(s.id in plan.include)) plan.include[s.id] = true });
  const inc = vids.filter(s => plan.include[s.id]);
  const now = new Date();
  const months = Array.from({ length: 6 }, (_, i) => new Date(now.getFullYear(), now.getMonth() + i, 1));
  months.forEach((m, i) => {
    const k = monthKey(m);
    if (!inc.find(s => s.id === plan.months[k]) && inc.length) plan.months[k] = inc[i % inc.length].id;
  });
  savePlan();

  const allCost = inc.reduce((a, s) => a + monthlyPrice(s), 0) * 6;
  const planCost = months.reduce((a, m) => {
    const picked = inc.find(s => s.id === plan.months[monthKey(m)]);
    return a + (picked ? monthlyPrice(picked) : 0);
  }, 0);
  const saved = Math.max(0, allCost - planCost);

  const thisPick = inc.find(s => s.id === plan.months[monthKey(months[0])]);
  const nextPick = inc.find(s => s.id === plan.months[monthKey(months[1])]);
  const todo = [];
  inc.filter(s => s !== thisPick).forEach(s => todo.push(`<div class="x">✕ <b>${esc(s.name)}</b> 해지 — 매월 ${s.day}일 결제 전</div>`));
  if (thisPick) todo.push(`<div class="o">✓ 이번 달은 <b>${esc(thisPick.name)}</b>만 유지</div>`);
  if (nextPick && nextPick !== thisPick) todo.push(`<div>→ 다음 달 <b>${esc(nextPick.name)}</b> 재구독 예정</div>`);

  body.innerHTML = `<div class="hero save"><small>6개월 동안 하나씩 돌려 쓰면</small>
      <div class="total">${fmt(saved)}</div>
      <div class="year">절약 · 다 유지 ${fmt(allCost)} → 계획 ${fmt(planCost)}</div></div>
    <div class="sectionhead"><h2>이번 달 할 일</h2></div>
    <div class="todo">${inc.length ? todo.join('') : '아래에서 돌려 쓸 OTT를 선택해 주세요.'}</div>
    <div class="sectionhead"><h2>월별 계획</h2></div><div class="list" id="monthList"></div>
    <div class="sectionhead"><h2>돌려 쓸 OTT</h2></div><div class="list" id="incList"></div>
    <div class="note">해지해도 대부분 결제일까지 시청 가능합니다.</div>`;

  const ml = $('#monthList');
  months.forEach((m, i) => {
    const k = monthKey(m), row = document.createElement('div'); row.className = 'month' + (i === 0 ? ' now' : '');
    const sel = document.createElement('select');
    inc.forEach(s => sel.append(new Option(s.name, s.id)));
    sel.value = plan.months[k] || '';
    sel.onchange = () => { plan.months[k] = sel.value; savePlan(); renderRotate() };
    const picked = inc.find(s => s.id === sel.value);
    row.innerHTML = `<span>${i === 0 ? '이번 달' : (m.getMonth() + 1) + '월'}</span>`;
    row.append(sel);
    const b = document.createElement('b'); b.textContent = fmt(picked ? monthlyPrice(picked) : 0); row.append(b);
    ml.append(row);
  });

  const il = $('#incList');
  vids.forEach(s => {
    const row = document.createElement('label'); row.className = 'toggle';
    row.innerHTML = `<input type="checkbox" ${plan.include[s.id] ? 'checked' : ''}><div><b>${esc(s.name)}</b><br><small>월 ${fmt(monthlyPrice(s))} · 매월 ${s.day}일</small></div>`;
    row.querySelector('input').onchange = e => { plan.include[s.id] = e.target.checked; savePlan(); renderRotate() };
    il.append(row);
  });
}

/* ---------- 백업 & 복원 ---------- */
$('#exportBtn').onclick = async () => {
  const json = JSON.stringify({ subs, plan }, null, 2);
  const file = new File([json], 'subtrack-backup.json', { type: 'application/json' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'SUBTRACK 백업' }); return } }
  catch (e) { if (e.name === 'AbortError') return }
  if (!isNative()) { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); return }
  try { await navigator.clipboard.writeText(json); alert('백업 데이터를 클립보드에 복사했어요.') }
  catch (e) { prompt('아래 내용을 복사해 보관하세요.', json) }
};

$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.subs)) throw new Error();
    if (!confirm(`구독 ${data.subs.length}개를 불러올까요? 현재 목록을 덮어씁니다.`)) return;
    subs = data.subs;
    plan = data.plan || { include: {}, months: {} };
    persist(); savePlan(); renderAll();
    alert('복원이 완료되었습니다.');
  } catch (err) { alert('올바른 SUBTRACK 백업 파일이 아닙니다.') }
  e.target.value = '';
};

/* ---------- 시작 ---------- */
async function renderAll() {
  if (tab === 'subs') renderSubs();
  if (tab === 'value') { renderValue(); await refreshUsage(); renderValue() }
  if (tab === 'rotate') renderRotate();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && tab === 'value') renderAll() });
renderAll();
if (!isNative() && 'serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
</script>
</body>
</html>
