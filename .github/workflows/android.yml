name: Build Android APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          if [ ! -f package.json ]; then
            cd "$(dirname "$(find . -name package.json -not -path '*/node_modules/*' | head -1)")"
          fi
          npm install
          npx cap add android
          node scripts/patch-android.js
          npm run android:icons
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: subtrack-apk
          path: app-debug.apk
